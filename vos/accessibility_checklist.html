* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, 'Malgun Gothic', sans-serif; font-size: 14px; background: #f1f5f9; color: #1e293b; }
a { color: inherit; }

.page-header p { color: #94a3b8; font-size: 1.3rem; }

/* Progress */
.progress-wrap { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 1.4rem 2rem; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

.save-dot { width: 6px; height: 6px; border-radius: 50%; background: #94a3b8; flex-shrink: 0; }

.progress-bar-bg { height: 8px; background: #e2e8f0; border-radius: 99px; overflow: hidden; }
.progress-bar-fill { height: 100%; background: linear-gradient(90deg, #27ae60, #2ecc71); border-radius: 99px; transition: width 0.4s ease; }

/* Stats chips */
.stats-row { display: flex; flex-wrap: wrap; gap: 0.6rem; padding: 1rem 2rem; background: #fff; border-bottom: 1px solid #e2e8f0; }
.stat-chip { display: flex; align-items: center; gap: 0.4rem; padding: 0.3rem 0.8rem; border-radius: 99px; font-size: 1.2rem; font-weight: 600; cursor: pointer; border: 2px solid transparent; transition: all 0.15s; }
.stat-chip:hover { opacity: 0.8; }
.stat-chip.active { border-color: currentColor; }
.stat-chip .cnt { background: rgba(0,0,0,0.15); border-radius: 99px; padding: 0 0.5rem; font-size: 1.1rem; }

/* View mode bar */
.view-bar { background: #f8fafc; border-bottom: 2px solid #e2e8f0; padding: 0.9rem 2rem; display: flex; gap: 0.7rem; flex-wrap: wrap; align-items: center; }
.view-btn { padding: 0.45rem 1.1rem; border-radius: 8px; border: 2px solid #e2e8f0; background: #fff; font-size: 1.25rem; cursor: pointer; color: #475569; font-weight: 700; transition: all 0.15s; white-space: nowrap; }
.view-btn:hover { border-color: #94a3b8; background: #f1f5f9; }
.view-btn.active { background: #1e293b; color: #fff; border-color: #1e293b; }
.view-btn.v-mobile.active { background: #7c3aed; border-color: #7c3aed; }
.view-btn.v-pc.active { background: #0369a1; border-color: #0369a1; }
.view-btn.v-design.active { background: #be185d; border-color: #be185d; }
.view-cnt { font-size: 1.05rem; background: rgba(0,0,0,0.1); border-radius: 99px; padding: 0 0.5rem; margin-left: 0.3rem; }

.view-notice { padding: 0.7rem 2rem; font-size: 1.2rem; font-weight: 600; display: none; border-bottom: 1px solid transparent; }

.view-notice.mobile { background: #f5f3ff; border-color: #ddd6fe; color: #5b21b6; }
.view-notice.pc { background: #eff6ff; border-color: #bfdbfe; color: #1e40af; }
.view-notice.design { background: #fdf2f8; border-color: #fbcfe8; color: #9d174d; }

.tag-scope-pc { background: #dbeafe; color: #1d4ed8; }

.card-header { display: flex; align-items: flex-start; gap: 1rem; padding: 1.2rem 1.4rem; cursor: pointer; }
.card-check { flex-shrink: 0; margin-top: 0.15rem; }
.card-check input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; accent-color: #27ae60; }

.card-title { font-size: 1.3rem; font-weight: 700; color: #1e293b; line-height: 1.4; }

.tag-page { background: #f1f5f9; color: #475569; }
.tag-device { background: #fef3c7; color: #92400e; }

.card-detail { border-top: 1px solid #f1f5f9; padding: 0 1.4rem 1.4rem; display: none; }
.card-detail.open { display: block; }
.detail-section { margin-top: 1rem; }
.detail-label { font-size: 1.1rem; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.4rem; display: flex; align-items: center; gap: 0.4rem; }
.detail-content { background: #f8fafc; border-radius: 6px; padding: 0.8rem 1rem; font-size: 1.2rem; line-height: 1.7; color: #334155; white-space: pre-wrap; border-left: 3px solid #e2e8f0; }

.attachment-box { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.8rem; background: #f8fafc; border-radius: 6px; border: 1px solid #e2e8f0; font-size: 1.1rem; color: #475569; margin-top: 1rem; }

.no-results { text-align: center; padding: 4rem 2rem; color: #94a3b8; font-size: 1.4rem; }

.action-bar { display: flex; gap: 0.8rem; justify-content: flex-end; padding: 1rem 2rem 0; }

    device:'SM-N971N, iPhone14', file:'마이알뜰폰_메인_내게맞는요금제찾기_결과레팝_바로배송유심주문하기 링크_레이블과 네임.png', cat:'input5',
    images:[IMG('_마이알뜰폰_메인_내게맞는요금제찾기_결과레팝_바로배송유심주문하기 링크_레이블과 네임.png')] },
];

const TOTAL = DATA.length;
let doneSet = new Set(JSON.parse(localStorage.getItem('a11y-done') || '[]'));
let activeCat = 'all';
let activePage = 'all';
let activeView = 'all';

function updateViewCounts() {
  document.getElementById('vcnt-all').textContent = DATA.length;
  document.getElementById('vcnt-mobile').textContent = DATA.filter(d => d.scope === 'mobile').length;
  document.getElementById('vcnt-pc').textContent = DATA.filter(d => d.scope === 'pc').length;
  document.getElementById('vcnt-design').textContent = DATA.filter(d => d.cat === 'color').length;
}

function filterView(view, el) {
  activeView = view;
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  const notice = document.getElementById('view-notice');
  notice.className = 'view-notice';
  if (view === 'design') {
    activeCat = 'color';
    activePage = 'all';
    document.querySelectorAll('#stats-row .stat-chip').forEach(b => b.classList.remove('active'));
    const colorChip = document.querySelector('#stats-row .stat-chip[data-cat="color"]');
    if (colorChip) colorChip.classList.add('active');
    document.querySelectorAll('.filter-btn[data-page]').forEach(b => b.classList.remove('active'));
    document.querySelector('.filter-btn[data-page="all"]').classList.add('active');
    notice.className = 'view-notice design show';
    notice.textContent = '🎨 디자인팀 공유 목록 — 1.4 명료성(명도/색상) 결함만 표시 · PC웹+모바일웹 통합';
  } else if (view === 'mobile') {
    notice.className = 'view-notice mobile show';
    notice.textContent = '📱 모바일웹 수정사항 — 모바일 단말 검증 결함만 표시 (PC 결함 제외)';
  } else if (view === 'pc') {
    notice.className = 'view-notice pc show';
    notice.textContent = '🖥️ PC웹 수정사항 — PC 브라우저 검증 결함만 표시 (모바일 결함 제외)';
  }
  renderCards();
}

function saveDone() {
  localStorage.setItem('a11y-done', JSON.stringify([...doneSet]));
}

function updateProgress() {
  const done = doneSet.size;
  document.getElementById('prog-count').textContent = done + ' / ' + TOTAL + ' 완료';
  document.getElementById('prog-bar').style.width = (done / TOTAL * 100).toFixed(1) + '%';
}

function renderStats() {
  const row = document.getElementById('stats-row');
  let html = '<button class="stat-chip active" data-cat="all" style="background:#f1f5f9;color:#334155;" onclick="filterCat(\'all\',this)">전체 <span class="cnt">' + TOTAL + '</span></button>';
  Object.entries(CATS).forEach(([key, cat]) => {
    const done = cat.ids.filter(n => doneSet.has(n)).length;
    html += `<button class="stat-chip" data-cat="${key}" style="background:${cat.color}22;color:${cat.color};" onclick="filterCat('${key}',this)">${cat.label} <span class="cnt">${done}/${cat.ids.length}</span></button>`;
  });
  row.innerHTML = html;
}

function filterCat(key, el) {
  // Switching cat resets design view back to all
  if (activeView === 'design') {
    activeView = 'all';
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('.view-btn[data-view="all"]').classList.add('active');
    document.getElementById('view-notice').className = 'view-notice';
  }
  activeCat = key;
  document.querySelectorAll('#stats-row .stat-chip').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderCards();
}

function filterPage(page, el) {
  activePage = page;
  document.querySelectorAll('.filter-btn[data-page]').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderCards();
}

function renderCards() {
  const main = document.getElementById('main');
  let filtered = DATA;
  // View mode filter
  if (activeView === 'mobile') filtered = filtered.filter(d => d.scope === 'mobile');
  else if (activeView === 'pc') filtered = filtered.filter(d => d.scope === 'pc');
  else if (activeView === 'design') filtered = filtered.filter(d => d.cat === 'color');
  // Page filter (skip in design view)
  if (activePage !== 'all' && activeView !== 'design') filtered = filtered.filter(d => {
    if (activePage === '셀프개통1단계') return d.page === '셀프개통1단계';
    if (activePage === '셀프개통2단계') return d.page === '셀프개통2단계';
    return d.page === activePage;
  });
  // Cat filter (skip in design view — forced to color)
  if (activeCat !== 'all' && activeView !== 'design') filtered = filtered.filter(d => d.cat === activeCat);

  if (filtered.length === 0) {
    main.innerHTML = '<div class="no-results">해당 조건의 결함이 없습니다</div>';
    return;
  }

  const byCat = {};
  filtered.forEach(d => {
    if (!byCat[d.cat]) byCat[d.cat] = [];
    byCat[d.cat].push(d);
  });

  let html = '';
  Object.entries(CATS).forEach(([catKey, cat]) => {
    if (!byCat[catKey]) return;
    const items = byCat[catKey];
    const doneCnt = items.filter(d => doneSet.has(d.no)).length;
    html += `<div class="cat-section" data-cat="${catKey}">
      <div class="cat-title" style="background:${cat.color};">
        ${cat.label}
        <span class="cat-cnt">${doneCnt}/${items.length} 완료</span>
      </div>`;
    items.forEach(d => {
      const isDone = doneSet.has(d.no);
      const cleanTitle = d.title.replace(/\[웹접근성\]/g, '').trim();
      html += `<div class="defect-card${isDone ? ' is-done' : ''}" id="card-${d.no}">
        <div class="card-header" onclick="toggleDetail(${d.no})">
          <div class="card-check" onclick="event.stopPropagation()">
            <input type="checkbox" id="chk-${d.no}" ${isDone ? 'checked' : ''} onchange="toggleDone(${d.no},this)">
          </div>
          <div class="card-meta">
            <div class="card-title-row">
              <span class="card-no">No.${d.no}</span>
              <span class="card-title">${cleanTitle}</span>
            </div>
            <div class="card-tags">
              <span class="tag tag-scope tag-scope-${d.scope}">${d.scope === 'mobile' ? '📱 모바일' : '🖥️ PC'}</span>
              <span class="tag tag-page">${d.page}</span>
              <span class="tag tag-id">#${d.id}</span>
              <span class="tag tag-id">${d.did}</span>
              <span class="tag tag-device">${d.device}</span>
              ${isDone ? '<span class="tag tag-done">✅ 완료</span>' : ''}
            </div>
          </div>
          <div class="card-expand-btn" id="exp-${d.no}">▼</div>
        </div>
        <div class="card-detail" id="det-${d.no}">
          <div class="detail-section">
            <div class="detail-label">🔬 재현 절차</div>
            <div class="detail-content">${d.steps || '(내용 없음)'}</div>
          </div>
          <div class="detail-section">
            <div class="detail-label">❌ 결함 내용</div>
            <div class="detail-content problem">${d.problem || '(내용 없음)'}</div>
          </div>
          <div class="detail-section">
            <div class="detail-label">✅ 정상 결과</div>
            <div class="detail-content expected">${d.expected || '(내용 없음)'}</div>
          </div>
          <div class="attachment-box">${d.file || '첨부파일 없음'}</div>
          ${d.images && d.images.length ? `
          <div class="img-label">🖼 오류 캡처 (${d.images.length}장)</div>
          <div class="img-gallery">${d.images.map((src,i) =>
            `<img class="img-thumb" src="${src}" alt="오류 캡처 ${i+1}" loading="lazy" onclick="lbOpen(${d.no},${i})" onerror="this.style.display='none'">`
          ).join('')}</div>` : ''}
        </div>
      </div>`;
    });
    html += '</div>';
  });

  main.innerHTML = html;
}

function toggleDone(no, checkbox) {
  if (checkbox.checked) doneSet.add(no);
  else doneSet.delete(no);
  saveDone();
  const card = document.getElementById('card-' + no);
  if (checkbox.checked) card.classList.add('is-done');
  else card.classList.remove('is-done');
  const tags = card.querySelector('.card-tags');
  const doneTag = tags.querySelector('.tag-done');
  if (checkbox.checked && !doneTag) tags.insertAdjacentHTML('beforeend', '<span class="tag tag-done">✅ 완료</span>');
  else if (!checkbox.checked && doneTag) doneTag.remove();
  updateProgress();
  renderStats();
}

function toggleDetail(no) {
  const det = document.getElementById('det-' + no);
  const exp = document.getElementById('exp-' + no);
  const isOpen = det.classList.contains('open');
  det.classList.toggle('open', !isOpen);
  exp.classList.toggle('open', !isOpen);
}

function expandAll() {
  document.querySelectorAll('.card-detail').forEach(d => d.classList.add('open'));
  document.querySelectorAll('.card-expand-btn').forEach(e => e.classList.add('open'));
}
function collapseAll() {
  document.querySelectorAll('.card-detail').forEach(d => d.classList.remove('open'));
  document.querySelectorAll('.card-expand-btn').forEach(e => e.classList.remove('open'));
}
function resetAll() {
  if (!confirm('모든 완료 표시를 초기화할까요?')) return;
  doneSet.clear();
  saveDone();
  updateProgress();
  renderStats();
  renderCards();
}

// Lightbox
let lbImages = [], lbIdx = 0;
function lbOpen(no, idx) {
  const d = DATA.find(x => x.no === no);
  if (!d || !d.images) return;
  lbImages = d.images;
  lbIdx = idx;
  lbShow();
  document.getElementById('lightbox').classList.add('open');
  document.addEventListener('keydown', lbKeyHandler);
}
function lbShow() {
  document.getElementById('lb-img').src = lbImages[lbIdx];
  document.getElementById('lb-caption').textContent = lbImages[lbIdx].replace('검증이미지/','');
  document.getElementById('lb-counter').textContent = (lbIdx+1) + ' / ' + lbImages.length;
  const nav = document.querySelector('.lightbox-nav');
  nav.style.display = lbImages.length > 1 ? 'flex' : 'none';
}
function lbClose() {
  document.getElementById('lightbox').classList.remove('open');
  document.removeEventListener('keydown', lbKeyHandler);
}
function lbPrev() { lbIdx = (lbIdx - 1 + lbImages.length) % lbImages.length; lbShow(); }
function lbNext() { lbIdx = (lbIdx + 1) % lbImages.length; lbShow(); }
function lbClickBg(e) { if (e.target === document.getElementById('lightbox')) lbClose(); }
function lbKeyHandler(e) {
  if (e.key === 'Escape') lbClose();
  if (e.key === 'ArrowLeft') lbPrev();
  if (e.key === 'ArrowRight') lbNext();
}

// Filter page buttons
document.querySelectorAll('.filter-btn[data-page]').forEach(btn => {
  btn.addEventListener('click', function() {
    filterPage(this.dataset.page, this);
  });
});

// Init
renderStats();
renderCards();
updateProgress();
updateViewCounts();
</script>
</body>
</html>
